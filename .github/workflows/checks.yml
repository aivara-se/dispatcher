name: Checks

on:
  push:
    branches: [main]
  pull_request:

# The workflow reads the repository and nothing else. Without this block the
# organisation's checks workflows trip the actions/missing-workflow-permissions
# CodeQL rule, and there is no reason to import that alert.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Tests
        run: go test ./...
